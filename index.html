<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>In-House-Dubbing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* In-House-Dubbing — enregistrement de voix maquettes, projet par projet.
   Layout : barre de commandes en haut, rail des séquences à gauche, répliques à droite.
   Nuit indigo, or des boutons d'action. Rouge réservé au Rec. */
:root{
  --sky:#11132A; --sky-2:#191C3A; --sky-3:#232750; --rule:#30355F;
  --dust:#B9B6AC; --hi:#EDEAE1; --orb:#E2B23F; --orb-soft:rgba(226,178,63,.13);
  --rec:#E5484D; --ok:#5BC48B; --ia:#7FD1C4;
  --display:"Bowlby One SC","Arial Black",Impact,sans-serif;
  --body:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--sky);color:var(--dust);font-family:var(--body);font-size:15px;line-height:1.55}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orb);outline-offset:2px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* barre du haut */
.top{position:sticky;top:0;z-index:20;background:rgba(17,19,42,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{position:relative;margin-right:auto;min-width:0}
.brandbtn{display:flex;align-items:center;gap:12px;background:none;border:0;padding:4px 8px 4px 0;border-radius:6px;text-align:left;min-width:0}
.brandbtn:hover .orb{box-shadow:0 0 0 2px rgba(226,178,63,.55),0 0 26px rgba(226,178,63,.6)}
.brandbtn .bt{min-width:0}
.brandbtn .caret{color:var(--dust);font-size:13px}
.brandbtn[aria-expanded="true"] .caret{color:var(--orb)}
.pmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:min(360px,90vw);background:var(--sky-2);border:1px solid var(--rule);border-radius:6px;box-shadow:0 14px 40px rgba(0,0,0,.45);padding:6px;display:flex;flex-direction:column;gap:2px}
.pmenu button{display:flex;justify-content:space-between;align-items:baseline;gap:14px;text-align:left;background:none;border:0;border-radius:4px;padding:9px 12px;color:var(--hi);font-size:14px}
.pmenu button:hover,.pmenu button:focus-visible{background:var(--sky-3)}
.pmenu button[aria-current="true"]{box-shadow:inset 3px 0 0 var(--orb);background:var(--sky-3)}
.pmenu button small{font-family:var(--mono);font-size:11px;color:var(--dust)}
.pmenu .new{color:var(--orb);font-weight:600}
.pmenu hr{border:0;border-top:1px solid var(--rule);margin:4px 2px}
.castlabel{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--hi);margin-right:2px}
.orb{width:30px;height:30px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 30%,#FFF1C4 0,#F0C552 18%,#C98F1E 52%,#6E4B0C 100%);box-shadow:0 0 18px rgba(226,178,63,.45)}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(18px,2.4vw,26px);color:var(--hi);letter-spacing:.01em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .label{color:var(--dust);display:block;margin-top:3px}
.pill{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:2px;border:1px solid var(--rule);white-space:nowrap}
.pill.on{border-color:var(--ok);color:var(--ok)}
.prog{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--hi)}
.bar{width:120px;height:6px;background:var(--sky-3);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orb);width:0}
.btn{background:var(--sky-3);border:1px solid var(--rule);border-radius:3px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--hi)}
.btn:hover{border-color:var(--dust)}
.btn.gold{background:var(--orb);border-color:var(--orb);color:#1A1405}
.btn.gold:hover{filter:brightness(1.08)}

.tools{max-width:1280px;margin:10px auto 0;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{background:none;border:1px solid var(--rule);border-radius:20px;padding:3px 10px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.fchip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.fchip[aria-pressed="true"]{background:var(--sky-3);border-color:var(--hi);color:var(--hi)}
.field{display:flex;align-items:center;gap:6px;font-size:12.5px}
.field select,.field input{background:var(--sky-2);border:1px solid var(--rule);border-radius:3px;padding:5px 8px;max-width:220px}
.field input{width:110px}
.check{display:flex;align-items:center;gap:6px;font-size:12.5px}

/* corps */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:250px 1fr;gap:28px;
  padding:22px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.nav{position:sticky;top:var(--toph,190px);align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - var(--toph,190px) - 20px);overflow:auto}
.nav button{text-align:left;background:none;border:1px solid transparent;border-radius:3px;padding:8px 10px;display:grid;grid-template-columns:44px 1fr auto;gap:6px;align-items:baseline}
.nav button:hover{background:var(--sky-2)}
.nav button[aria-current="true"]{background:var(--sky-2);border-color:var(--rule);box-shadow:inset 3px 0 0 var(--orb)}
.nav .n{font-family:var(--mono);font-size:11px;color:var(--dust)}
.nav .t{color:var(--hi);font-weight:600;font-size:13.5px;line-height:1.3}
.nav .c{font-family:var(--mono);font-size:11px;color:var(--dust)}
.nav .c.full{color:var(--ok)}
.nav .sep{height:1px;background:var(--rule);margin:6px 0}
.navsel{display:none}

.seqhead{display:flex;flex-direction:column;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.seqhead .row1{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.seqhead h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(24px,3vw,32px);color:var(--hi);line-height:1.05}
.slug{font-family:var(--mono);font-size:12px;color:var(--dust)}
.seqcast{display:flex;flex-wrap:wrap;gap:6px}
.seqcast .fchip{padding:4px 11px;font-size:13px}
.seqcast .fchip b{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--dust)}
.seqcast .fchip.done b{color:var(--ok)}
.seqcast .fchip[aria-pressed="true"] b{color:var(--hi)}
.summary{color:var(--hi);max-width:72ch;font-size:15.5px}
.folder{font-family:var(--mono);font-size:11.5px;color:var(--dust)}

.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:34px 150px minmax(0,1fr) 300px;gap:14px;padding:14px 10px;border-bottom:1px solid var(--rule);border-radius:3px;align-items:start;outline:none}
.line:hover{background:rgba(255,255,255,.015)}
.line.focus{background:var(--sky-2);box-shadow:inset 3px 0 0 var(--hi)}
.line.playing{box-shadow:inset 3px 0 0 var(--orb);background:var(--orb-soft)}
.line.recording{box-shadow:inset 3px 0 0 var(--rec);background:rgba(229,72,77,.08)}
.num{font-family:var(--mono);font-size:12px;color:var(--dust);padding-top:3px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--hi)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.en{margin:0;color:var(--hi);font-size:18px;line-height:1.45}
.en.vocal{font-style:italic;color:var(--dust);font-size:16px}
.en mark{background:none;color:var(--orb);border-bottom:1px dashed var(--orb)}
.dir{margin:6px 0 0;font-size:13.5px;color:var(--dust)}
.dir .pg{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:6px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:2px;border:1px solid var(--orb);color:var(--orb);margin-left:6px;vertical-align:2px}
.tag.v{border-color:var(--dust);color:var(--dust)}

.ctl{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.rec{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--rec);background:none;color:#FFD9DA;border-radius:20px;padding:6px 14px 6px 10px;font-weight:700;font-size:13px;letter-spacing:.04em}
.rec::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--rec)}
.rec:hover{background:rgba(229,72,77,.15)}
.rec.on{background:var(--rec);color:#fff}
.rec.on::before{border-radius:2px;background:#fff}
.rec.busy{opacity:.6;pointer-events:none}
.meter{width:120px;height:6px;border-radius:3px;background:var(--sky-3);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--orb) 75%,var(--rec))}
.timer{font-family:var(--mono);font-size:12px;color:#FFD9DA}
.recrow{display:flex;align-items:center;gap:10px}
.takes{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.take{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;font-family:var(--mono);font-size:11.5px}
.take button{background:none;border:0;padding:3px 7px;color:var(--dust)}
.take button:hover{color:var(--hi);background:var(--sky-3)}
.take .tp{color:var(--hi)}
.take.sel{border-color:var(--orb)}
.take.sel .tp{background:var(--orb);color:#1A1405}
.take .ts{border-left:1px solid var(--rule)}
.take .td{border-left:1px solid var(--rule)}
.take .td.confirm{background:var(--rec);color:#fff}
.take .tc{border-left:1px solid var(--rule);color:var(--ia) !important;font-weight:500}
.take.ia{border-color:var(--ia)}
.take.ia .tp{color:var(--ia)}
.take.ia.sel{border-color:var(--orb)}
.take.ia.sel .tp{background:var(--orb);color:#1A1405}
.take .busy{opacity:.6;pointer-events:none}
.elbox{background:var(--sky-2);border:1px solid var(--ia);border-radius:4px;padding:18px 20px;margin-bottom:18px;display:flex;flex-direction:column;gap:12px}
.elbox h3{margin:0;color:var(--hi);font-size:17px}
.elbox p{margin:0;font-size:14px;max-width:72ch}
.elrow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.elrow input[type=password]{background:var(--sky);border:1px solid var(--rule);border-radius:3px;padding:7px 10px;min-width:0;width:min(360px,100%);font-family:var(--mono);font-size:13px}
.elrow select{background:var(--sky);border:1px solid var(--rule);border-radius:3px;padding:5px 8px}
.elrow input[type=range]{width:110px;accent-color:var(--ia)}
.ok{color:var(--ok);font-weight:600}
.elbox .hint{font-size:13px;color:var(--dust)}
.vsel{display:flex;gap:6px;align-items:center;margin-top:10px}
.vsel select{flex:1;min-width:0;background:var(--sky);border:1px solid var(--rule);border-radius:3px;padding:5px 8px;font-size:13px}
.vsel button{background:var(--sky-3);border:1px solid var(--rule);border-radius:3px;padding:4px 8px;font-size:12px}
.none{font-family:var(--mono);font-size:11.5px;color:var(--dust);opacity:.7}

.voices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.voice{background:var(--sky-2);border:1px solid var(--rule);border-radius:4px;padding:16px 18px}
.voice h3{margin:0 0 6px;color:var(--hi);font-size:16px;display:flex;align-items:center;gap:8px}
.voice h3 i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.voice p{margin:0;font-size:14px}
.voice .cnt{font-family:var(--mono);font-size:11px;margin-top:8px;display:block}

.help{max-width:76ch;display:flex;flex-direction:column;gap:18px}
.help h3{margin:0 0 6px;color:var(--hi);font-size:17px}
.help ol,.help ul{margin:0;padding-left:20px;display:grid;gap:6px}
.help code{font-family:var(--mono);font-size:12.5px;color:var(--hi);background:var(--sky-2);padding:1px 5px;border-radius:2px}
.help .box{background:var(--sky-2);border:1px solid var(--rule);border-radius:4px;padding:16px 18px}

.gate{position:fixed;inset:0;z-index:40;background:var(--sky);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate form{width:min(380px,100%);background:var(--sky-2);border:1px solid var(--rule);border-radius:6px;padding:26px;display:flex;flex-direction:column;gap:14px}
.gate .orb{width:44px;height:44px}
.gate h2{margin:0;font-family:var(--display);font-weight:400;color:var(--hi);font-size:24px;line-height:1.05}
.gate p{margin:0;font-size:14px}
.gate label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--hi)}
.gate input,.acct input,.acct select{background:var(--sky);border:1px solid var(--rule);border-radius:3px;padding:8px 10px;color:var(--hi)}
.gate .err{color:#FF9A9D;font-size:13.5px;min-height:1em}
.who{font-family:var(--mono);font-size:12px;color:var(--hi)}
.acct{display:flex;flex-direction:column;gap:18px;max-width:760px}
.acct .box{background:var(--sky-2);border:1px solid var(--rule);border-radius:4px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.acct h3{margin:0;color:var(--hi);font-size:17px}
.acct .row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.acct .row label{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.acct table{width:100%;border-collapse:collapse;font-size:14px}
.acct td,.acct th{text-align:left;padding:8px 10px 8px 0;border-top:1px solid var(--rule)}
.acct th{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-top:0}
.acct td.act{text-align:right;white-space:nowrap}
.acct td.act button{margin-left:6px}
.home{display:flex;flex-direction:column;gap:18px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pcard{text-align:left;background:var(--sky-2);border:1px solid var(--rule);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:10px;color:var(--dust)}
.pcard:hover{border-color:var(--orb)}
.pcard .pn{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.pcard h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;color:var(--hi);line-height:1.05}
.pcard .bar{width:100%}
.pcard .meta{font-family:var(--mono);font-size:12px}
.acct table{margin-top:4px}
.acct .chip{font-size:13px}
.acct .projs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hi);color:var(--sky);padding:10px 16px;border-radius:3px;font-weight:600;font-size:14px;z-index:50;max-width:min(92vw,560px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.err{background:var(--rec);color:#fff}
.keys{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));font-family:var(--mono);font-size:11px;color:var(--dust);background:var(--sky-2);border:1px solid var(--rule);border-radius:3px;padding:6px 10px}
.keys b{color:var(--hi);font-weight:500}

.layout.nonav{grid-template-columns:1fr}
@media (max-width:1050px){ .line{grid-template-columns:30px minmax(0,1fr)} .line .who{grid-column:2} .line .txt{grid-column:2} .line .ctl{grid-column:2;align-items:flex-start} .takes{justify-content:flex-start} }
@media (max-width:860px){ .layout{grid-template-columns:1fr} .nav{display:none} .navsel{display:block;width:100%;background:var(--sky-2);border:1px solid var(--rule);border-radius:3px;padding:8px;margin-bottom:14px} .voices{grid-template-columns:1fr} .keys{display:none} .top{position:static} }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <button class="brandbtn" id="brandbtn" type="button" aria-haspopup="menu" aria-expanded="false" title="Changer de projet"><span class="orb" aria-hidden="true"></span><span class="bt"><h1 id="apptitle">In-House-Dubbing</h1><span class="label" id="projlabel">Projets</span></span><span class="caret" aria-hidden="true">▾</span></button>
      <div class="pmenu" id="pmenu" role="menu" hidden></div>
    </div>
    <button class="btn" id="home" type="button" hidden>← Projets</button>
    <span class="pill" id="mode"></span>
    <div class="prog"><span id="progtxt">0 / 0</span><span class="bar"><i id="progbar"></i></span></div>
    <button class="btn" id="playseq" type="button">▶ Lire la séquence</button>
    <button class="btn gold" id="transfer" type="button">Transfert audio</button>
    <span class="who" id="who" hidden></span><button class="btn" id="logout" type="button" hidden>Déconnexion</button>
  </div>
  <div class="tools">
    <div class="chips" id="filters" aria-label="Cast"></div>
    <label class="check"><input type="checkbox" id="todo"> Seulement à enregistrer</label>
    <label class="field" id="micfield">Micro <select id="mic"><option value="">Micro par défaut</option></select></label>
    <label class="field" id="namefield"><span id="namelabel">Prénom</span> <input id="name" maxlength="24" autocomplete="off"></label>
    <label class="check" id="advfield"><input type="checkbox" id="advance" checked> Ligne suivante après chaque prise</label>
    <label class="check" id="autoiafield" hidden><input type="checkbox" id="autoia"> Voix IA automatique après chaque prise</label>
  </div>
</header>

<div class="layout">
  <nav class="nav" id="nav" aria-label="Séquences"></nav>
  <main id="main">
    <select class="navsel" id="navsel" aria-label="Séquence"></select>
    <div id="view"></div>
  </main>
</div>

<div class="keys" id="keys"><b>Espace</b> rec / stop · <b>P</b> écouter · <b>↑ ↓</b> réplique</div>
<div class="toast" id="toast" hidden></div>
<div class="gate" id="gate" hidden></div>

<script>
/* ================== LE PROJET ==================
   Le scénario de chaque projet est chargé depuis le serveur (api.php?action=script)
   ou, hors ligne, depuis le fichier _projet.js écrit par le transfert. Format : voir README. */
let PROJECT = null, CHARS = {}, SEQS = [];

/* ================== ÉTAT ================== */
const ONLINE = /^https?:$/.test(location.protocol);
const QS = new URLSearchParams(location.search);
const KEY = QS.get("k") || "";
let PID = QS.get("p") || "";
let LINES = [], BYID = {};
function loadProject(p){
  PROJECT = p; CHARS = p.chars || {};
  SEQS = (p.seqs || []).map(s => ({id: s.id, folder: s.folder, t: s.title, slug: s.slug || "", p: s.pages || "", s: s.summary || "", L: s.lines || []}));
  LINES = [];
  SEQS.forEach((s, si) => s.L.forEach(l => LINES.push({id: s.id + "_L" + l[0], seq: si, folder: s.folder, num: l[0], ch: l[1], kind: l[2] || "", text: l[3], dir: l[4] || "", pg: l[5] || ""})));
  BYID = Object.fromEntries(LINES.map(l => [l.id, l]));
  document.title = p.title + " · In-House-Dubbing";
  $("#apptitle").textContent = p.title;
  $("#projlabel").textContent = "In-House-Dubbing" + (p.num ? " · Projet " + p.num : "") + (p.subtitle ? " · " + p.subtitle : "");
  const nv = p.nameVar;
  $("#namefield").hidden = !nv || !ONLINE;
  if (nv) $("#namelabel").textContent = nv.label;
}
let state = {name: "", takes: {}, selected: {}, el: {hasKey: false, voices: {}}};
let ME = null;                // {name, role}
let elVoices = null;          // liste des voix du compte ElevenLabs (chargée à la demande)
const converting = new Set(); // prises en cours de conversion
let localFound = {};
let cur = 0;                 // index de séquence ; -1 = les voix ; -2 = mode d'emploi ; -3 = comptes ; -9 = accueil
let filter = "ALL";
let focusId = null;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k){try{return localStorage.getItem("ihd-"+PID+"-"+k)}catch(e){return null}}, set(k,v){try{localStorage.setItem("ihd-"+PID+"-"+k,v)}catch(e){}}};

function toast(msg, err){ const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, err ? 6000 : 2600); }

async function api(action, data){
  if (SB) return sbApi(action, data);
  let url = "api.php?action=" + action + (PID ? "&p=" + encodeURIComponent(PID) : "");
  let opt = {cache: "no-store"};
  if (data){ const fd = data instanceof FormData ? data : new FormData(); if (!(data instanceof FormData)) for (const k in data) fd.append(k, data[k]); opt = {method: "POST", body: fd}; }
  else url += "&_=" + Date.now();
  const r = await fetch(url, opt);
  let j; try { j = await r.json(); } catch(e) { j = {ok: false, error: "Le serveur a répondu de façon inattendue (" + r.status + ")."}; }
  if (r.status === 401 && j.login){ showGate("login"); throw new Error(j.error); }
  if (!j.ok) throw new Error(j.error || "Erreur du serveur.");
  return j;
}
function applyState(j){
  if (j.takes){ state.name = j.name || state.name; state.takes = j.takes || {}; state.selected = j.selected || {}; }
  if (j.el){ state.el = j.el; $("#autoiafield").hidden = !(ONLINE && state.el.hasKey); $("#autoia").checked = !!state.el.auto; $("#autoia").disabled = !(ME && ME.role === "admin"); $("#autoiafield").title = $("#autoia").disabled ? "Réglé par l'admin pour tout le monde" : ""; }
}
function voiceFor(ch){ return state.el && state.el.voices && state.el.voices[ch]; }
function canConvert(ch){ return ONLINE && state.el && state.el.hasKey && !!voiceFor(ch); }

function hasAudio(id){ return ONLINE ? !!(state.takes[id] && state.takes[id].length) : !!localFound[id]; }
function audioUrl(id, file){
  if (SB){ const s = SIGNED[PID + "/" + (file || state.selected[id])]; return s ? s.url : ""; }
  if (ONLINE) return "api.php?action=audio&p=" + encodeURIComponent(PID) + "&f=" + encodeURIComponent(file || state.selected[id]);
  return localFound[id];
}
function baseName(l){ return l.id + "_" + l.ch + ".wav"; }
function visibleLines(si){ return SEQS[si].L.map(x => BYID[SEQS[si].id + "_L" + x[0]]).filter(l => (filter === "ALL" || l.ch === filter) && (!$("#todo").checked || !hasAudio(l.id))); }

function lineText(l){
  if (l.kind === "v") return '<p class="en vocal">' + esc(l.text) + '<span class="tag v">son vocal</span></p>';
  const t = esc(l.text).split("{NAME}").join("<mark>" + esc(state.name || (PROJECT && PROJECT.nameVar ? PROJECT.nameVar.def : "") || "{NAME}") + "</mark>");
  return '<p class="en">' + t + (l.kind === "a" ? '<span class="tag">adapté</span>' : "") + "</p>";
}
function takesHtml(l){
  if (!ONLINE) return localFound[l.id] ? '<div class="takes"><span class="take sel"><button class="tp" data-act="play" type="button">▶ ' + esc(baseName(l)) + '</button></span></div>' : '<span class="none">Pas encore de fichier</span>';
  const list = state.takes[l.id] || [];
  if (!list.length) return '<span class="none">Aucune prise</span>';
  const conv = canConvert(l.ch);
  return '<div class="takes">' + list.map(t => {
    const sel = state.selected[l.id] === t.f;
    const busy = converting.has(t.f);
    let h = '<span class="take' + (sel ? " sel" : "") + '" data-file="' + esc(t.f) + '">' +
      '<button class="tp" data-act="play" type="button" title="Écouter la prise ' + t.t + (t.by ? " (enregistrée par " + esc(t.by) + ")" : "") + '">▶ P' + t.t + (t.dur ? " · " + (+t.dur).toFixed(1) + "s" : "") + '</button>' +
      (sel ? "" : '<button class="ts" data-act="select" type="button" title="Retenir cette prise">★</button>') +
      (conv && !t.cv ? '<button class="tc' + (busy ? " busy" : "") + '" data-act="convert" data-src="' + esc(t.f) + '" type="button" title="Convertir avec la voix ElevenLabs de ' + esc(voiceFor(l.ch).name) + '">' + (busy ? "…" : "→ IA") + '</button>' : "") +
      '<button class="td" data-act="delete" type="button" title="Supprimer cette prise">✕</button></span>';
    if (t.cv){
      const s2 = state.selected[l.id] === t.cv.f;
      h += '<span class="take ia' + (s2 ? " sel" : "") + '" data-file="' + esc(t.cv.f) + '">' +
        '<button class="tp" data-act="play" type="button" title="Version IA de la prise ' + t.t + ' (voix ' + esc(t.cv.v) + ')">▶ P' + t.t + '·IA</button>' +
        (s2 ? "" : '<button class="ts" data-act="select" type="button" title="Retenir la version IA">★</button>') +
        (conv ? '<button class="tc' + (busy ? " busy" : "") + '" data-act="convert" data-src="' + esc(t.f) + '" type="button" title="Refaire la conversion (voix ' + esc(voiceFor(l.ch).name) + ')">' + (busy ? "…" : "↻") + '</button>' : "") +
        '<button class="td" data-act="delete" type="button" title="Supprimer la version IA">✕</button></span>';
    }
    return h;
  }).join("") + "</div>";
}

function seqCastHtml(si){
  const s = SEQS[si], order = [];
  s.L.forEach(x => { if (!order.includes(x[1])) order.push(x[1]); });
  const chip = (k, label, a, b, color) => '<button class="fchip' + (a === b ? " done" : "") + '" type="button" data-f="' + k + '" aria-pressed="' + (filter === k) + '"' + (color ? ' style="--c:' + color + '"' : "") + ' title="' + (k === "ALL" ? "Toute la scène" : "Seulement les répliques de " + esc(label) + " dans cette séquence") + '">' + (color ? "<i></i>" : "") + esc(label) + " <b>" + a + "/" + b + "</b></button>";
  const ids = s.L.map(x => [s.id + "_L" + x[0], x[1]]);
  let h = chip("ALL", "Toute la scène", ids.filter(x => hasAudio(x[0])).length, ids.length, "");
  order.forEach(k => { const mine = ids.filter(x => x[1] === k); h += chip(k, CHARS[k].n, mine.filter(x => hasAudio(x[0])).length, mine.length, CHARS[k].c); });
  return '<div class="seqcast" aria-label="Personnages de la séquence">' + h + "</div>";
}

      '<label class="field">Qualité <select id="elformat">' + opt("wav_48000", e.format, "WAV 48 kHz") + opt("wav_44100", e.format, "WAV 44,1 kHz") + opt("wav_24000", e.format, "WAV 24 kHz") + '</select></label>' +

function voiceSelHtml(ch){
  const cur = voiceFor(ch);
  let opts = '<option value="">— Pas de voix IA —</option>';
  if (elVoices) opts += elVoices.map(v => '<option value="' + esc(v.id) + '"' + (cur && cur.id === v.id ? " selected" : "") + ">" + esc(v.name) + (v.cat ? " · " + esc(v.cat) : "") + "</option>").join("");
  else if (cur) opts += '<option value="' + esc(cur.id) + '" selected>' + esc(cur.name) + "</option>";
  const n = reconvTargets(ch).length;
  return '<div class="vsel"><select data-voice="' + ch + '" aria-label="Voix ElevenLabs de ' + esc(CHARS[ch].n) + '">' + opts + '</select><button type="button" data-preview="' + ch + '" title="Écouter un extrait de la voix">▶</button></div>' +
    (cur && n ? '<div class="vsel"><button type="button" data-reconv="' + ch + '" title="Refait la version IA de ses prises à partir des originaux, avec la voix choisie">↻ Refaire ses ' + n + ' prise(s) avec ' + esc(cur.name) + '</button></div>' : "");
}
// Prises d'un personnage à (re)convertir avec sa voix actuelle : versions IA faites avec une autre voix, et prises retenues sans version IA.
function reconvTargets(ch){
  const v = voiceFor(ch); if (!v) return [];
  const out = [];
  LINES.filter(l => l.ch === ch).forEach(l => (state.takes[l.id] || []).forEach(t => {
    if (t.cv ? t.cv.vid !== v.id : state.selected[l.id] === t.f) out.push([l.id, t.f]);
  }));
  return out;
}
async function reconvertChar(ch, b){
  const todo = reconvTargets(ch); if (!todo.length) return;
  b.disabled = true;
  let ok = 0;
  for (let i = 0; i < todo.length; i++){
    b.textContent = "Conversion " + (i + 1) + "/" + todo.length + "…";
    if (await convertTake(todo[i][0], todo[i][1], true)) ok++; else break;
  }
  toast(ok + " prise(s) de " + CHARS[ch].n + " refaite(s) avec la voix " + voiceFor(ch).name + ".");
  if (cur === -1) renderView();
}
async function loadVoices(){
  try { const j = await api("elvoices"); elVoices = j.voices; if (cur === -1) renderView(); }
  catch(e){ toast(e.message, true); }
}
async function convertTake(id, src, quiet){
  if (converting.has(src)) return false;
  converting.add(src); refreshLine(id);
  try {
    const j = await api("convert", {line: id, file: src});
    applyState(j);
    if (!quiet) toast("Version IA prête · " + CHARS[BYID[id].ch].n + " " + BYID[id].num + " (voix " + j.cv.v + ")");
    return true;
  } catch(e) {
    toast("Conversion impossible : " + e.message, true);
    return false;
  } finally { converting.delete(src); refreshLine(id); }
}
async function convertSeq(){
  const btn = $("#convseq");
  const todo = SEQS[cur].L.map(x => BYID[SEQS[cur].id + "_L" + x[0]]).filter(l => canConvert(l.ch)).map(l => {
    const t = (state.takes[l.id] || []).find(t => t.f === state.selected[l.id]);
    return t && !t.cv ? [l.id, t.f] : null;
  }).filter(Boolean);
  const noVoice = [...new Set(SEQS[cur].L.map(x => x[1]).filter(ch => !voiceFor(ch)))];
  if (!todo.length){ toast(noVoice.length ? "Rien à convertir. Personnages sans voix IA choisie : " + noVoice.map(c => CHARS[c].n).join(", ") + "." : "Toutes les prises retenues de cette séquence ont déjà leur version IA."); return; }
  btn.disabled = true;
  let ok = 0;
  for (let i = 0; i < todo.length; i++){
    btn.textContent = "Conversion " + (i + 1) + "/" + todo.length + "…";

/* ================== MODE SUPABASE ==================
   Si un fichier supabase-config.js est posé à côté de la page, l'appli utilise Supabase
   (comptes, base, stockage des prises, fonction « ihd ») au lieu de api.php.
   sbApi() répond exactement comme api.php, le reste de la page ne voit pas la différence. */
let SB = null, SBST = null;          // client Supabase, état des clés (fonction ihd)
const SIGNED = {};                   // URL signées des fichiers audio : "projet/fichier" -> {url, exp}
const SBLIB = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
function loadScript(src){ return new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ko(new Error("Chargement impossible : " + src)); document.head.appendChild(s); }); }
async function detectSupabase(){
  try { await loadScript("supabase-config.js"); } catch(e) { return false; }
  const c = window.IHD_SUPABASE;
  if (!c || !c.url || !c.anonKey) return false;
  if (!window.supabase) await loadScript(SBLIB);
  SB = window.supabase.createClient(c.url, c.anonKey);
  SB.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") showGateSB("recovery"); });
  return true;
}
const fdObj = d => { if (!(d instanceof FormData)) return d || {}; const o = {}; for (const [k, v] of d.entries()) o[k] = v; return o; };
const sbCheck = r => { if (r.error) throw new Error(r.error.message); return r.data; };
async function sbFn(action, payload){
  const {data, error} = await SB.functions.invoke("ihd", {body: {action, ...(payload || {})}});
  if (error){ let msg = error.message; try { const j = await error.context.json(); msg = j.error || msg; } catch(e) {} throw new Error(msg); }
  if (!data || !data.ok) throw new Error((data && data.error) || "La fonction « ihd » a répondu de façon inattendue.");
  return data;
}
async function sbStatus(force){ if (!SBST || force){ try { SBST = await sbFn("status"); } catch(e) { SBST = {elHasKey: false, aiHasKey: false, aiModels: {}, fnError: e.message}; } } return SBST; }
const epoch = t => t ? Math.floor(new Date(t).getTime() / 1000) : 0;
async function sbMe(){
  const {data: {session}} = await SB.auth.getSession();
  if (!session) return {ok: true, needsSetup: false, user: null};
  const p = sbCheck(await SB.from("profiles").select("*").eq("id", session.user.id).maybeSingle());
  if (!p) return {ok: true, user: null};
  return {ok: true, user: {id: p.id, name: p.name || p.email, email: p.email, role: p.role, projects: p.projects || []}};
}
async function sbState(pid){
  const [tk, sel, meta, sett, voi] = await Promise.all([
    SB.from("takes").select("*").eq("project", pid).order("t"),
    SB.from("selected").select("*").eq("project", pid),
    SB.from("project_meta").select("*").eq("project", pid).maybeSingle(),
    SB.from("project_settings").select("*").eq("project", pid).maybeSingle(),
    SB.from("project_voices").select("*").eq("project", pid)]);
  [tk, sel, meta, sett, voi].forEach(sbCheck);
  const takes = {}, selected = {}, voices = {};
  tk.data.forEach(r => (takes[r.line] = takes[r.line] || []).push({f: r.f, t: r.t, s: r.s, d: epoch(r.created_at), dur: r.dur, by: r.by_name, cv: r.cv || undefined}));
  sel.data.forEach(r => selected[r.line] = r.f);
  voi.data.forEach(r => voices[r.ch] = {id: r.voice_id, name: r.voice_name});
  const st = await sbStatus();
  const c = {model: "eleven_multilingual_sts_v2", format: "wav_44100", stability: 0.5, similarity: 0.75, noise: false, auto: false, ...((sett.data && sett.data.settings) || {})};
  // URL signées (1 h) pour écouter et transférer les fichiers.
  const now = Date.now() / 1000, files = [];
  tk.data.forEach(r => { files.push(r.f); if (r.cv) files.push(r.cv.f); });
  const need = files.filter(f => !SIGNED[pid + "/" + f] || SIGNED[pid + "/" + f].exp < now + 600);
  for (let i = 0; i < need.length; i += 200){
    const part = need.slice(i, i + 200);
    const urls = sbCheck(await SB.storage.from("takes").createSignedUrls(part.map(f => pid + "/" + f), 3600));
    urls.forEach((u, k) => { if (u.signedUrl) SIGNED[pid + "/" + part[k]] = {url: u.signedUrl, exp: now + 3600}; });
  }
  return {ok: true, name: (meta.data && meta.data.name) || (PROJECT && PROJECT.nameVar ? PROJECT.nameVar.def : "") || "", takes, selected, updated: 0,
          el: {hasKey: !!st.elHasKey, keyHint: st.elHint || "", model: c.model, format: c.format, stability: +c.stability, similarity: +c.similarity, noise: !!c.noise, auto: !!c.auto, voices}};
}
function sbValidate(p){
  if (!p || !/^[a-z0-9][a-z0-9-]{1,39}$/.test(p.id || "")) return "Identifiant de projet invalide.";
  if (!p.title || !p.chars || !Array.isArray(p.seqs) || !p.seqs.length) return "Fichier de projet incomplet (titre, personnages, séquences).";
  for (const s of p.seqs) for (const l of s.lines || []) if (!p.chars[l[1]]) return "Personnage inconnu : " + l[1];
  return null;
}
async function sbApi(action, data){
  const o = fdObj(data);
  switch (action){
    case "me": return sbMe();
    case "projects": {
      const ps = sbCheck(await SB.from("projects").select("id,num,data").order("num"));
      const tk = sbCheck(await SB.from("takes").select("project,line"));
      const done = {}; tk.forEach(r => (done[r.project] = done[r.project] || new Set()).add(r.line));
      return {ok: true, projects: ps.map(p => ({id: p.id, num: p.num, title: p.data.title, subtitle: p.data.subtitle || "", seqs: (p.data.seqs || []).length,
        lines: (p.data.seqs || []).reduce((a, s) => a + (s.lines || []).length, 0), done: done[p.id] ? done[p.id].size : 0, chars: Object.keys(p.data.chars || {}).length}))};
    }
    case "script": return {ok: true, project: sbCheck(await SB.from("projects").select("data").eq("id", PID).single()).data};
    case "state": return sbState(PID);
    case "projectimport": {
      const p = JSON.parse(await o.file.text());
      const err = sbValidate(p); if (err) throw new Error(err);
      const old = sbCheck(await SB.from("projects").select("num").eq("id", p.id).maybeSingle());
      const count = sbCheck(await SB.from("projects").select("id")).length;
      p.num = p.num || (old ? old.num : count + 1);
      sbCheck(await SB.from("projects").upsert({id: p.id, num: p.num, data: p}));
      return {ok: true, id: p.id, updated: !!old, migrated: false};
    }
    case "upload": {
      const last = sbCheck(await SB.from("takes").select("t").eq("project", PID).eq("line", o.line).order("t", {ascending: false}).limit(1));
      const n = (last.length ? last[0].t : 0) + 1;
      const f = o.folder + "/" + o.line + "_" + o.char + "_T" + n + ".wav";
      sbCheck(await SB.storage.from("takes").upload(PID + "/" + f, o.audio, {contentType: "audio/wav"}));
      sbCheck(await SB.from("takes").insert({project: PID, line: o.line, t: n, f, s: o.audio.size, dur: +o.dur, by_name: ME.name}));
      sbCheck(await SB.from("selected").upsert({project: PID, line: o.line, f}));
      return {...(await sbState(PID)), take: {f, t: n, s: o.audio.size, dur: +o.dur, by: ME.name}};
    }
    case "select": sbCheck(await SB.from("selected").upsert({project: PID, line: o.line, f: o.file})); return sbState(PID);
    case "delete": {
      const rows = sbCheck(await SB.from("takes").select("*").eq("project", PID).eq("line", o.line).order("t"));
      const trash = async rel => { await SB.storage.from("takes").move(PID + "/" + rel, PID + "/_corbeille/" + Date.now() + "_" + rel.split("/")[1]); };
      const orig = rows.find(r => r.f === o.file), cvRow = rows.find(r => r.cv && r.cv.f === o.file);
      let keep = rows;
      if (orig){ await trash(orig.f); if (orig.cv) await trash(orig.cv.f); sbCheck(await SB.from("takes").delete().eq("id", orig.id)); keep = rows.filter(r => r !== orig); }
      else if (cvRow){ await trash(o.file); sbCheck(await SB.from("takes").update({cv: null}).eq("id", cvRow.id)); keep = rows.map(r => r === cvRow ? {...r, cv: null} : r); }
      const sel = sbCheck(await SB.from("selected").select("f").eq("project", PID).eq("line", o.line).maybeSingle());
      if (!keep.some(r => sel && (r.f === sel.f || (r.cv && r.cv.f === sel.f)))){
        if (keep.length) sbCheck(await SB.from("selected").upsert({project: PID, line: o.line, f: keep[keep.length - 1].f}));
        else sbCheck(await SB.from("selected").delete().eq("project", PID).eq("line", o.line));
      }
      return sbState(PID);
    }
    case "name": sbCheck(await SB.from("project_meta").upsert({project: PID, name: o.name})); return sbState(PID);
    case "elsettings": {
      const cur = sbCheck(await SB.from("project_settings").select("settings").eq("project", PID).maybeSingle());
      const s = {...((cur && cur.settings) || {})};
      ["model", "format"].forEach(k => { if (o[k] !== undefined) s[k] = o[k]; });
      ["stability", "similarity"].forEach(k => { if (o[k] !== undefined) s[k] = Math.max(0, Math.min(1, +o[k])); });
      ["noise", "auto"].forEach(k => { if (o[k] !== undefined) s[k] = o[k] === "1"; });
      sbCheck(await SB.from("project_settings").upsert({project: PID, settings: s}));
      return {ok: true, el: (await sbState(PID)).el};
    }
    case "elmap":
      if (o.id) sbCheck(await SB.from("project_voices").upsert({project: PID, ch: o.char, voice_id: o.id, voice_name: o.name}));
      else sbCheck(await SB.from("project_voices").delete().eq("project", PID).eq("ch", o.char));
      return {ok: true, el: (await sbState(PID)).el};
    case "elkey": SBST = await sbFn("elkey", {key: o.key}); return {ok: true};
    case "elvoices": return sbFn("elvoices");
    case "convert": { const r = await sbFn("convert", {project: PID, line: o.line, file: o.file}); return {...(await sbState(PID)), cv: r.cv}; }
    case "aiconfig": case "aikey": case "aimodel": {
      if (action === "aikey") SBST = await sbFn("aikey", {key: o.key});
      else if (action === "aimodel") SBST = await sbFn("aimodel", {model: o.model});
      else await sbStatus(true);
      if (SBST.fnError) throw new Error("La fonction « ihd » ne répond pas : " + SBST.fnError + " Vérifiez qu'elle est déployée (voir GUIDE.md).");
      return {ok: true, ai: {hasKey: !!SBST.aiHasKey, keyHint: SBST.aiHint || "", model: SBST.aiModel, models: SBST.aiModels}};
    }
    case "claude": return sbFn("claude", o);
    case "users": {
      const us = sbCheck(await SB.from("profiles").select("*").order("created_at"));
      const ps = sbCheck(await SB.from("projects").select("id,num,data").order("num"));
      return {ok: true, users: us.map(u => ({id: u.id, name: u.name || u.email, email: u.email, role: u.role, created: epoch(u.created_at), projects: u.projects || []})),
              allProjects: ps.map(p => ({id: p.id, title: p.data.title}))};
    }
    case "userprojects": sbCheck(await SB.from("profiles").update({projects: (o.projects || "").split(",").filter(Boolean)}).eq("id", o.user)); return {ok: true};
    case "userrole": sbCheck(await SB.from("profiles").update({role: o.role}).eq("id", o.user)); return {ok: true};
    case "userdel": return sbFn("userdel", {user: o.user});
    case "userreset": sbCheck(await SB.auth.resetPasswordForEmail(o.email, {redirectTo: location.origin + location.pathname})); return {ok: true};
    case "mypass": {
      if ((o.new || "").length < 8) throw new Error("Nouveau mot de passe : au moins 8 caractères.");
      sbCheck(await SB.auth.updateUser({password: o.new})); return {ok: true};
    }
  }
  throw new Error("Action non disponible avec Supabase : " + action);
}

  for (let n = 1; n <= pdf.numPages; n++){
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    const rows = [];
    for (const it of tc.items){
      if (!it.str || !it.str.trim()) continue;
      const x = it.transform[4], y = it.transform[5];
      let r = rows.find(r => Math.abs(r.y - y) < 2.5);
      if (!r){ r = {y, items: []}; rows.push(r); }
      r.items.push({x, w: it.width, s: it.str});
    }
    rows.sort((a, b) => b.y - a.y);
    for (const r of rows){
      r.items.sort((a, b) => a.x - b.x);
      let t = "", end = null;
      for (const it of r.items){ if (end !== null && it.x - end > 1.5 && !t.endsWith(" ")) t += " "; t += it.s; end = it.x + it.w; }
      out.push({page: n, y: r.y, x: r.items[0].x, text: t.replace(/\s+/g, " ").trim()});

}
const isCaps = t => /[A-Z]/.test(t) && t === t.toUpperCase();
const stripParens = t => t.replace(/\([^)]*\)/g, "").trim();
const charKey = n => { const k = n.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^A-Z]/g, ""); return k.slice(0, 20); };
const titleCase = n => n.toLowerCase().replace(/(^|[\s'-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
const slugify = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

// Découpe un scénario au format standard : en-têtes de scène, action, personnages, répliques.
function parseScreenplay(raw){
  const lines = raw.map(l => ({...l, text: l.text.replace(/\s+\*+$/, "").replace(/^\*+\s+/, "").trim()}))
    .filter(l => l.text && !/^\*+$/.test(l.text) && !/^\d+\.?$/.test(l.text) && !/Rev\.\s*\(|\(mm\/dd\/yy\)|^\(?MORE\)?$|^CONTINUED:?$|^\(CONTINUED\)$/i.test(l.text));
  if (!lines.length) throw new Error("Aucun texte lisible dans ce PDF. S'il s'agit d'un scan, il faut d'abord le passer à l'OCR.");
  const hist = {};
  lines.filter(l => l.text.length > 35).forEach(l => { const k = Math.round(l.x / 3) * 3; hist[k] = (hist[k] || 0) + 1; });
  const A = +(Object.entries(hist).sort((a, b) => b[1] - a[1])[0] || [lines[0].x])[0];
  const gaps = [];
  for (let i = 1; i < lines.length; i++) if (lines[i].page === lines[i-1].page) gaps.push(lines[i-1].y - lines[i].y);
  gaps.sort((a, b) => a - b);
  const lh = gaps[Math.floor(gaps.length * 0.25)] || 12;
  const SLUG = /^(INT|EXT|INT\.?\s*\/\s*EXT|EXT\.?\s*\/\s*INT|I\/E|EST)[.\s]/, SLUG2 = /^(MONTAGE|SERIES OF SHOTS|FLASHBACK|INTERCUT|END MONTAGE)\b/;
  const items = [];
  let cur = null, parenOpen = false, prev = null;
  for (const l of lines){
    const brk = !prev || prev.page !== l.page || (prev.y - l.y) > lh * 1.5;
    const ind = l.x - A;
    prev = l;
    if (ind < 25 && isCaps(l.text) && (SLUG.test(l.text) || SLUG2.test(l.text))){ items.push({type: "slug", text: l.text, page: l.page}); cur = null; continue; }
    const bare = stripParens(l.text);
    if (brk && ind > 95 && ind < 300 && bare && isCaps(bare) && l.text.length < 50 && !/:$/.test(l.text)){
      cur = {type: "line", cue: bare.replace(/\bCONT[’']?D\b/g, "").replace(/\s+/g, " ").trim(), text: "", paren: [], page: l.page};
      items.push(cur); parenOpen = false; continue;
    }
    if (cur && !brk && ind > 40){
      if (parenOpen || (l.text.startsWith("(") && !cur.text)){ cur.paren.push(l.text); parenOpen = !l.text.includes(")"); }
      else if (l.text.startsWith("(") && l.text.endsWith(")")) cur.paren.push(l.text);
      else cur.text += (cur.text ? " " : "") + l.text;
      continue;
    }
    cur = null; parenOpen = false;
    if (ind > 280 && isCaps(l.text)) continue;   // transitions (CUT TO:, THE END…)
    const last = items[items.length - 1];
    if (!brk && last && last.type === "action") last.text += " " + l.text;
    else items.push({type: "action", text: l.text, page: l.page});
  }
  // Didascalies dans le texte, (comme ceci) : sorties vers les notes.
  const out = items.filter(it => it.type !== "line" || it.text || it.paren.length).map(it => {
    if (it.type !== "line") return it;
    const inl = []; const text = it.text.replace(/\(([^)]*)\)/g, (m, a) => { inl.push(a.trim()); return ""; }).replace(/\s+/g, " ").replace(/\s+([,.!?])/g, "$1").trim();
    return {...it, text, paren: it.paren.map(p => p.replace(/^\(|\)$/g, "").trim()).concat(inl).filter(Boolean)};
  }).filter(it => it.type !== "line" || it.text);
  // Personnages : FRANKLIN et BENJAMIN FRANKLIN sont la même personne.
  const names = [...new Set(out.filter(i => i.type === "line").map(i => i.cue))];
  const alias = {};
  names.forEach(n => { const m = names.filter(o => o !== n && o.endsWith(" " + n)); if (m.length === 1 && !n.includes(" ")) alias[n] = m[0]; });
  const chars = {}, used = {};
  let li = 0;
  out.forEach(it => {
    if (it.type !== "line") return;
    it.cue = alias[it.cue] || it.cue;
    let k = used[it.cue];
    if (!k){ k = charKey(it.cue) || "PERSO"; let base = k, n = 2; while (Object.values(used).includes(k)) k = base.slice(0, 18) + (n++); used[it.cue] = k; chars[k] = {n: titleCase(it.cue), count: 0, cue: it.cue}; }
    it.ch = k; chars[k].count++;
    it.n = ++li;
  });
  if (!li) throw new Error("Aucune réplique trouvée. Le PDF n'a peut-être pas la mise en page standard d'un scénario (noms des personnages centrés au-dessus des répliques).");
  return {items: out, chars, lines: li};
}
// Séquences par défaut : une par en-tête de scène (coupée au-delà de 40 répliques).
function defaultSequences(d){
  const seqs = []; let curS = null;
  d.items.forEach(it => {
    if (it.type === "slug" || !curS){ curS = {title: it.type === "slug" ? it.text : "Ouverture", slug: it.type === "slug" ? it.text : "", lines: [], first: it.page, last: it.page}; seqs.push(curS); if (it.type === "slug") return; }
    curS.last = it.page;
    if (it.type === "line") curS.lines.push(it.n);
  });
  const outS = [];
  seqs.filter(s => s.lines.length).forEach(s => { for (let i = 0; i < s.lines.length; i += 40) outS.push({title: s.title + (s.lines.length > 40 ? " (" + (i / 40 + 1) + ")" : ""), slug: s.slug, start: s.lines[i], summary: ""}); });
  return outS;
}
function screenplayText(d, from, to){
  let t = "";
  d.items.forEach(it => {
    if (it.type === "slug") t += "\n### " + it.text + "\n";
    else if (it.type === "action") t += it.text + "\n";
    else if ((!from || it.n >= from) && (!to || it.n <= to)) t += "[L" + it.n + "] " + it.cue + (it.paren.length ? " (" + it.paren.join("; ") + ")" : "") + " : " + it.text + "\n";
  });
  return t;
}
function parseJson(text){
  const m = text.match(/```(?:json)?\s*([\s\S]*?)```/); const raw = (m ? m[1] : text).trim();
  const a = raw.indexOf("{"), b = raw.lastIndexOf("}");
  return JSON.parse(raw.slice(a, b + 1));
}
async function claude(system, prompt, max){ const j = await api("claude", {system, prompt, max: String(max)}); return j.text; }
const SYS = "Tu prépares des sessions d'enregistrement de voix maquettes pour un film d'animation. Tu écris en français, de façon concrète et brève, pour un comédien. Tu réponds uniquement avec du JSON valide, sans aucun texte autour.";

async function enrichWithClaude(d, status){
  const keys = Object.keys(d.chars).map(k => k + " = " + d.chars[k].cue).join(", ");
  status("Claude lit le scénario et le découpe en séquences…");
  const t1 = await claude(SYS, "Voici un scénario. Chaque réplique est numérotée [L1], [L2]…\n\n" + screenplayText(d) +
    "\n\nPrépare l'enregistrement. Réponds avec ce JSON :\n" +
    '{"sequences":[{"start":1,"title":"titre court","summary":"2 à 4 phrases : ce qui se passe, qui est là, l\'enjeu"}],' +
    '"characters":{"CLE":{"name":"nom affiché","voice":"direction de voix : âge, timbre, débit, attitude, en 1 à 3 phrases"}},' +
    '"vocals":[{"after":12,"char":"CLE","text":"[description courte du son]","dir":"intention"}]}\n\n' +
    "Règles :\n- sequences : des blocs de travail cohérents de 5 à 25 répliques, coupés aux changements de décor et aux temps dramatiques. start = numéro de la première réplique du bloc ; le premier bloc commence à 1 ; les blocs se suivent dans l'ordre et couvrent toutes les répliques.\n" +
    "- characters : une entrée par clé, avec exactement ces clés : " + keys + ".\n" +
    "- vocals : les sons vocaux sans texte décrits dans l'action et qu'il faudra enregistrer (cris, rires, efforts, souffles, chutes de groupe). after = numéro de la réplique juste avant (0 = avant la première). Clé GROUPE pour les sons collectifs.", 12000);
  const r1 = parseJson(t1);
  // Contrôle du découpage proposé.
  let seqs = (r1.sequences || []).filter(s => +s.start >= 1 && +s.start <= d.lines).map(s => ({title: String(s.title || "").slice(0, 80), summary: String(s.summary || ""), start: +s.start}));
  seqs.sort((a, b) => a.start - b.start);
  seqs = seqs.filter((s, i) => i === 0 || s.start !== seqs[i-1].start);
  if (!seqs.length || seqs[0].start !== 1) seqs = defaultSequences(d).map((s, i) => ({...s, summary: (seqs[i] && seqs[i].summary) || ""}));
  const slugOf = n => { let sl = ""; for (const it of d.items){ if (it.type === "slug") sl = it.text; if (it.n === n) break; } return sl; };
  seqs.forEach(s => s.slug = slugOf(s.start));
  Object.entries(r1.characters || {}).forEach(([k, c]) => { if (d.chars[k]){ if (c.name) d.chars[k].n = String(c.name).slice(0, 40); d.chars[k].v = String(c.voice || ""); } });
  const vocals = (r1.vocals || []).filter(v => v && v.text && +v.after >= 0 && +v.after <= d.lines).map(v => ({after: +v.after, ch: charKey(String(v.char || "GROUPE")) || "GROUPE", text: String(v.text), dir: String(v.dir || "")}));
  vocals.forEach(v => { if (!d.chars[v.ch]) d.chars[v.ch] = {n: v.ch === "GROUPE" ? "Groupe" : titleCase(v.ch), count: 0, cue: v.ch, v: v.ch === "GROUPE" ? "Sons collectifs : efforts, chutes, cris." : ""}; });
  // Intentions de jeu, séquence par séquence.
  const dirs = {};
  for (let i = 0; i < seqs.length; i++){
    const from = seqs[i].start, to = i + 1 < seqs.length ? seqs[i+1].start - 1 : d.lines;
    status("Claude écrit les intentions de jeu · séquence " + (i + 1) + "/" + seqs.length + "…");
    const t2 = await claude(SYS, "Scénario complet pour le contexte :\n\n" + screenplayText(d, from, to) +
      "\n\nÉcris l'intention de jeu des répliques [L" + from + "] à [L" + to + "] : une phrase courte par réplique pour le comédien (état, intention, ce qu'il faut appuyer, éventuellement le geste ou la situation). Réponds avec ce JSON : {\"L" + from + "\":\"…\", …}", 6000);
    try { Object.assign(dirs, parseJson(t2)); } catch(e) {}
  }
  return {seqs, vocals, dirs};
}
function buildProject(d, meta, enr){
  const seqDefs = enr ? enr.seqs : defaultSequences(d);
  const byN = {}; d.items.forEach(it => { if (it.type === "line") byN[it.n] = it; });
  const seqs = [];
  seqDefs.forEach((s, i) => {
    const from = s.start, to = i + 1 < seqDefs.length ? seqDefs[i+1].start - 1 : d.lines;
    const rows = [];
    const addVocals = after => (enr ? enr.vocals : []).filter(v => v.after === after).forEach(v => rows.push(["", v.ch, "v", v.text, v.dir, byN[Math.max(1, after)] ? byN[Math.max(1, after)].page : ""]));
    if (i === 0) addVocals(0);
    for (let n = from; n <= to; n++){
      const it = byN[n]; if (!it) continue;
      const dir = [(enr && enr.dirs["L" + n]) || "", it.paren.length ? "(" + it.paren.join(" ; ") + ")" : ""].filter(Boolean).join(" ");
      rows.push(["", it.ch, "", it.text, dir, it.page]);
      addVocals(n);
    }
    for (let k = 0; k < rows.length; k += 99) seqs.push({title: s.title + (rows.length > 99 ? " (" + (k / 99 + 1) + ")" : ""), slug: s.slug || "", summary: s.summary || "", rows: rows.slice(k, k + 99)});
  });
  if (seqs.length > 99) throw new Error("Plus de 99 séquences : découpez le scénario en plusieurs projets.");
  const chars = {};
  Object.keys(d.chars).forEach((k, i) => chars[k] = {n: d.chars[k].n, c: PALETTE[i % PALETTE.length], v: d.chars[k].v || ""});
  return {
    id: meta.id, title: meta.title, subtitle: meta.subtitle || "", source: meta.source || "", chars,
    seqs: seqs.map((s, i) => {
      const id = "SEQ" + String(i + 1).padStart(2, "0");
      const pages = [...new Set(s.rows.map(r => r[5]).filter(Boolean))];
      return {id, folder: id + "_" + (slugify(s.title).slice(0, 28).replace(/-+$/, "") || "sequence"), title: s.title, slug: s.slug,
        pages: pages.length ? "p." + Math.min(...pages) + (Math.max(...pages) > Math.min(...pages) ? "–" + Math.max(...pages) : "") : "",
        summary: s.summary, lines: s.rows.map((r, j) => [String(j + 1).padStart(2, "0"), r[1], r[2], r[3], r[4], r[5]])};
    })
  };
}

const player = new Audio();

function markPlaying(id){ document.querySelectorAll(".line.playing").forEach(r => r.classList.remove("playing")); if (id){ const r = document.querySelector('.line[data-id="' + id + '"]'); if (r){ r.classList.add("playing"); r.scrollIntoView({block: "nearest", behavior: "smooth"}); } } }
function play(id, file){
  stopSeq(true);
  const u = audioUrl(id, file); if (!u) return;
  player.src = u; player.currentTime = 0;
  player.play().then(() => markPlaying(id)).catch(e => toast("Lecture impossible : " + e.message, true));
  player.onended = () => markPlaying(null);
}
function stopSeq(keepPlayer){ if (seqPlay){ seqPlay = null; $("#playseq").textContent = "▶ Lire la séquence"; } if (!keepPlayer){ player.pause(); markPlaying(null); } }
function playSeq(){
  if (seqPlay){ stopSeq(); return; }
  const ids = visibleLines(cur).map(l => l.id).filter(hasAudio);
  if (!ids.length){ toast("Aucune prise à lire dans cette séquence pour l'instant."); return; }
  seqPlay = {ids, i: 0};
  $("#playseq").textContent = "■ Arrêter";
  const next = () => {
    if (!seqPlay) return;
    if (seqPlay.i >= seqPlay.ids.length){ stopSeq(); return; }
    const id = seqPlay.ids[seqPlay.i++];
    player.src = audioUrl(id); player.currentTime = 0;
    markPlaying(id);
    player.onended = () => setTimeout(next, 250);
    player.play().catch(() => setTimeout(next, 50));
  };
  next();
}

  if (dev) a.deviceId = {exact: dev};
  stream = await navigator.mediaDevices.getUserMedia({audio: a});
  if (!actx){ try { actx = new AudioContext({sampleRate: 48000}); } catch(e) { actx = new AudioContext(); } }
  if (!workletReady){
    const url = URL.createObjectURL(new Blob([WORKLET], {type: "application/javascript"}));
    await actx.audioWorklet.addModule(url);
    workletReady = true;
  }
  fillMics();
}
async function fillMics(){
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput");
    const sel = $("#mic"), v = sel.value || store.get("mic") || "";
    sel.innerHTML = '<option value="">Micro par défaut</option>' + devs.map(d => '<option value="' + esc(d.deviceId) + '">' + esc(d.label || "Micro") + "</option>").join("");
    if ([...sel.options].some(o => o.value === v)) sel.value = v;
  } catch(e) {}
}
async function startRec(id){
  if (rec) return;
  try { await ensureMic(); } catch(e) { toast(e.name === "NotAllowedError" ? "Le micro est bloqué. Autorisez-le dans la barre d'adresse du navigateur, puis réessayez." : "Micro indisponible : " + e.message, true); return; }
  if (actx.state === "suspended") await actx.resume();
  stopSeq();
  const src = actx.createMediaStreamSource(stream);
  const node = new AudioWorkletNode(actx, "ergo-rec");
  const r = {id, chunks: [], peak: 0, t0: performance.now(), src, node};
  node.port.onmessage = e => { r.chunks.push(e.data); let m = 0; const d = e.data; for (let i = 0; i < d.length; i += 4){ const a = Math.abs(d[i]); if (a > m) m = a; } r.peak = Math.max(m, r.peak * 0.85); };
  src.connect(node); node.connect(actx.destination);
  rec = r;
  const row = document.querySelector('.line[data-id="' + id + '"]');
  if (row){ row.classList.add("recording"); const b = row.querySelector(".rec"); b.classList.add("on"); b.textContent = "Stop"; row.querySelector(".meter").hidden = false; row.querySelector(".timer").hidden = false; }
  const tick = () => {
    if (rec !== r) return;
    const row = document.querySelector('.line[data-id="' + id + '"]');
    if (row){ row.querySelector(".meter i").style.width = Math.min(100, r.peak * 140) + "%"; const s = (performance.now() - r.t0) / 1000; row.querySelector(".timer").textContent = Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); }
    requestAnimationFrame(tick);
  };
  tick();
}
function wavBlob(chunks, sr){
  let len = 0; chunks.forEach(c => len += c.length);
  const cutA = Math.round(sr * 0.06), cutB = Math.round(sr * 0.12);
  let from = 0, to = len;
  if (len > sr * 0.6){ from = cutA; to = len - cutB; }
  const n = to - from;
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  let pos = 0, o = 44;
  for (const c of chunks){ for (let i = 0; i < c.length; i++, pos++){ if (pos < from || pos >= to) continue; const s = Math.max(-1, Math.min(1, c[i])); v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true); o += 2; } }
  return {blob: new Blob([buf], {type: "audio/wav"}), dur: n / sr};
}
async function stopRec(){
  const r = rec; if (!r) return;
  rec = null;
  r.src.disconnect(); r.node.disconnect(); r.node.port.onmessage = null;
  const l = BYID[r.id];
  const row = document.querySelector('.line[data-id="' + r.id + '"]');
  const btn = row && row.querySelector(".rec");
  if (row){ row.classList.remove("recording"); btn.classList.remove("on"); btn.textContent = "Envoi…"; btn.classList.add("busy"); row.querySelector(".meter").hidden = true; }
  const {blob, dur} = wavBlob(r.chunks, actx.sampleRate);
  if (dur < 0.2){ toast("Prise trop courte, rien n'a été envoyé."); if (btn){ btn.textContent = "Rec"; btn.classList.remove("busy"); } return; }
  const fd = new FormData();
  fd.append("line", l.id); fd.append("folder", l.folder); fd.append("char", l.ch); fd.append("dur", dur.toFixed(2));
  fd.append("audio", blob, baseName(l));
  try {
    const j = await api("upload", fd);
    applyState(j);
    toast("Prise " + j.take.t + " enregistrée · " + CHARS[l.ch].n + " " + l.num);
    refreshLine(l.id);
    if ($("#advance").checked) moveFocus(1);
    if ($("#autoia").checked && canConvert(l.ch)) convertTake(l.id, j.take.f);
  } catch(e) {
    toast("La prise n'a pas pu être envoyée : " + e.message + " Elle est perdue, refaites-la.", true);
  } finally {
    if (row && row.isConnected){ row.querySelector(".timer").hidden = true; btn.textContent = "Rec"; btn.classList.remove("busy"); }
  }
}
function toggleRec(id){ if (rec){ const was = rec.id; stopRec(); if (was !== id) setTimeout(() => startRec(id), 0); } else startRec(id); }

/* ================== FOCUS / CLAVIER ================== */
function setFocus(id, scroll){
  focusId = id;
  document.querySelectorAll(".line.focus").forEach(r => r.classList.remove("focus"));
  const row = document.querySelector('.line[data-id="' + id + '"]');
  if (row){ row.classList.add("focus"); if (scroll !== false) row.scrollIntoView({block: "center", behavior: "smooth"}); }
}
function moveFocus(d){
  const rows = [...document.querySelectorAll(".line")]; if (!rows.length) return;
  let i = rows.findIndex(r => r.dataset.id === focusId);
  i = i < 0 ? 0 : Math.max(0, Math.min(rows.length - 1, i + d));
  setFocus(rows[i].dataset.id);
}
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey || !$("#pmenu").hidden) return;
  if (cur < 0) return;
  if (e.code === "Space" || e.key === "r" || e.key === "R"){ if (!ONLINE) return; e.preventDefault(); if (!focusId) moveFocus(0); if (focusId) toggleRec(focusId); }
  else if (e.key === "ArrowDown" || e.key === "j"){ e.preventDefault(); moveFocus(1); }
  else if (e.key === "ArrowUp" || e.key === "k"){ e.preventDefault(); moveFocus(-1); }
  else if (e.key === "p" || e.key === "P" || e.key === "Enter"){ if (focusId && hasAudio(focusId)){ e.preventDefault(); play(focusId); } }
});

/* ================== CLICS ================== */
document.addEventListener("click", async e => {
  const nav = e.target.closest("[data-nav]"); if (nav){ go(+nav.dataset.nav); return; }
  const f = e.target.closest("[data-f]"); if (f){ filter = f.dataset.f; renderFilters(); renderView(); return; }
  const row = e.target.closest(".line"); if (!row) return;
  const id = row.dataset.id;
  setFocus(id, false);
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (e.detail) b.blur();   // un clic souris ne doit pas laisser le focus sur le bouton (la touche Espace le relancerait)
  const act = b.dataset.act, take = b.closest(".take"), file = take && take.dataset.file;
  if (act === "rec") toggleRec(id);
  else if (act === "play") play(id, file);
  else if (act === "convert") convertTake(id, b.dataset.src);
  else if (act === "select"){ try { applyState(await api("select", {line: id, file})); refreshLine(id); } catch(err) { toast(err.message, true); } }
  else if (act === "delete"){
    if (!b.classList.contains("confirm")){ b.classList.add("confirm"); b.textContent = "Supprimer ?"; setTimeout(() => { if (b.isConnected){ b.classList.remove("confirm"); b.textContent = "✕"; } }, 3000); return; }
    try { applyState(await api("delete", {line: id, file})); refreshLine(id); toast("Prise supprimée."); } catch(err) { toast(err.message, true); }
  }
});
$("#navsel").addEventListener("change", e => go(+e.target.value));
$("#todo").addEventListener("change", renderView);
$("#playseq").addEventListener("click", playSeq);
$("#mic").addEventListener("change", e => { store.set("mic", e.target.value); if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } });
$("#name").addEventListener("change", async e => {
  const v = e.target.value.trim(); if (!v || v === state.name) return;
  try { applyState(await api("name", {name: v})); renderView(); toast("Prénom enregistré pour tout le monde : " + state.name); } catch(err) { toast(err.message, true); e.target.value = state.name; }
});
window.addEventListener("beforeunload", e => { if (rec){ e.preventDefault(); e.returnValue = ""; } });

/* ================== TRANSFERT VERS LE PC ================== */
const idb = {
  open(){ return new Promise((ok, ko) => { const r = indexedDB.open("ergo-vm", 1); r.onupgradeneeded = () => r.result.createObjectStore("h"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); },
  async get(k){ const db = await this.open(); return new Promise(ok => { const q = db.transaction("h").objectStore("h").get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); },
  async set(k, v){ const db = await this.open(); return new Promise(ok => { const t = db.transaction("h", "readwrite"); t.objectStore("h").put(v, k); t.oncomplete = ok; t.onerror = ok; }); }
};
async function pickDir(){
  let dir = null;
  try { dir = await idb.get("dir-" + PID); } catch(e) {}
  if (dir){
    let p = await dir.queryPermission({mode: "readwrite"});
    if (p !== "granted") p = await dir.requestPermission({mode: "readwrite"});
    if (p === "granted") return dir;
  }
  dir = await window.showDirectoryPicker({id: ("ihd-" + PID).slice(0, 32), mode: "readwrite"});
  try { await idb.set("dir-" + PID, dir); } catch(e) {}
  return dir;
}
async function writeIfChanged(dirH, name, size, getBlob){
  const fh = await dirH.getFileHandle(name, {create: true});
  const cur = await fh.getFile();
  if (cur.size === size) return false;
  const blob = await getBlob();
  const w = await fh.createWritable(); await w.write(blob); await w.close();
  return true;
}
async function sameBytes(file, blob){
  if (file.size !== blob.size) return false;
  const n = Math.min(blob.size, 262144);
  const a = new Uint8Array(await file.slice(0, n).arrayBuffer()), b = new Uint8Array(await blob.slice(0, n).arrayBuffer());
  for (let i = 0; i < n; i++) if (a[i] !== b[i]) return false;
  return true;
}
async function transfer(){
  if (!window.showDirectoryPicker){ toast("Le transfert vers le PC marche dans Chrome ou Edge, sur ordinateur.", true); return; }
  const btn = $("#transfer");
  let dir;
  try { dir = await pickDir(); } catch(e) { if (e.name !== "AbortError") toast("Dossier non accessible : " + e.message, true); return; }
  btn.disabled = true;
  try {
    applyState(await api("state"));
    const ids = Object.keys(state.takes).filter(id => BYID[id]);
    const total = ids.reduce((a, id) => a + state.takes[id].reduce((n, t) => n + (t.cv ? 2 : 1), 0) + 1, 0);
    let done = 0, written = 0;
    const cache = {};
    const fetchBlob = async f => { if (!cache[f]){ const r = await fetch(audioUrl(null, f), {cache: "no-store"}); if (!r.ok) throw new Error("fichier " + f + " introuvable sur le serveur"); cache[f] = await r.blob(); } return cache[f]; };
    for (const id of ids){
      const l = BYID[id];
      const seqDir = await dir.getDirectoryHandle(l.folder, {create: true});
      const prDir = await seqDir.getDirectoryHandle("_prises", {create: true});
      for (const t of state.takes[id]){
        for (const x of t.cv ? [t, t.cv] : [t]){
          if (await writeIfChanged(prDir, x.f.split("/")[1], x.s, () => fetchBlob(x.f))) written++;
          btn.textContent = "Transfert " + (++done) + "/" + total;
        }
      }
      const selF = state.selected[id];
      if (selF && state.takes[id].some(t => t.f === selF || (t.cv && t.cv.f === selF))){
        const fh = await seqDir.getFileHandle(baseName(l), {create: true});
        const blob = await fetchBlob(selF);
        if (!(await sameBytes(await fh.getFile(), blob))){ const w = await fh.createWritable(); await w.write(blob); await w.close(); written++; }
      }
      btn.textContent = "Transfert " + (++done) + "/" + total;
    }
    // Lecteur hors ligne : la page et le scénario du projet.
    try {
      const js = "window.IHD_PROJECT = " + JSON.stringify(PROJECT) + ";\nwindow.IHD_NAME = " + JSON.stringify(state.name) + ";\n";
      const w1 = await (await dir.getFileHandle("_projet.js", {create: true})).createWritable(); await w1.write(new Blob([js], {type: "text/javascript"})); await w1.close();
      const page = await (await fetch("index.html", {cache: "no-store"})).blob();
      const w2 = await (await dir.getFileHandle("In-House-Dubbing.html", {create: true})).createWritable(); await w2.write(page); await w2.close();
    } catch(e) {}
    toast(written ? written + " fichier(s) copié(s) dans " + dir.name + "." : "Tout est déjà à jour dans " + dir.name + ".");
  } catch(e) {
    toast("Transfert interrompu : " + e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = "Transfert audio";
  }
}
$("#transfer").addEventListener("click", transfer);

/* ================== MODE DOSSIER LOCAL ================== */
function probeLocal(){
  let pending = LINES.length;
  LINES.forEach(l => {
    const url = encodeURI(l.folder + "/" + baseName(l));
    const a = new Audio();
    a.preload = "metadata";
    const done = ok => { if (ok) localFound[l.id] = url; if (--pending % 20 === 0 || pending === 0) renderAll(); a.removeAttribute("src"); };
    a.onloadedmetadata = () => done(true);
    a.onerror = () => done(false);
    a.src = url;
  });
}

/* ================== DÉMARRAGE ================== */
let polling = null;
async function startApp(){
  showWho();
  if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) fillMics();
  if (PID) await openProject(PID); else goHome();
  if (!polling) polling = setInterval(async () => { if (!ME || !PID || rec || document.hidden) return; try { const before = JSON.stringify([state.takes, state.selected, state.name]); applyState(await api("state")); if (JSON.stringify([state.takes, state.selected, state.name]) !== before){ $("#name").value = state.name; renderAll(); } } catch(e) {} }, 20000);
}
function syncTop(){ document.documentElement.style.setProperty("--toph", ($(".top").offsetHeight + 16) + "px"); }
window.addEventListener("resize", syncTop);
(async function init(){
  syncTop();
  if (ONLINE){
    $("#mode").textContent = "En ligne"; $("#mode").classList.add("on");
    let me = null;
    if (await detectSupabase()){
      $("#mode").textContent = "En ligne · Supabase";
      try { me = await sbMe(); } catch(e) { toast("Supabase injoignable : " + e.message, true); return; }
      if (!me.user){ showGateSB("login"); return; }
      if (me.user.role === "pending"){ showGateSB("pending"); return; }
      ME = me.user; await startApp(); return;
    }
    try { me = await (await fetch("api.php?action=me", {cache: "no-store"})).json(); } catch(e) { toast("Serveur injoignable.", true); return; }
    if (me.needsSetup){ if (KEY) showGate("setup"); else $("#gate").hidden = false, $("#gate").innerHTML = '<form><h2>In-House-Dubbing</h2><p>Le compte administrateur n\'a pas encore été créé. Ouvrez le lien d\'installation complet.</p></form>'; return; }
    if (!me.user){ showGate("login"); return; }
    ME = me.user;
    await startApp();
  } else {
    $("#mode").textContent = "Dossier local · lecture seule";
    ["#transfer", "#micfield", "#namefield", "#advfield"].forEach(q => $(q).hidden = true);
    $("#keys").innerHTML = "<b>P</b> écouter · <b>↑ ↓</b> réplique";
    const sc = document.createElement("script");
    sc.src = "_projet.js";
    sc.onload = () => {
      if (!window.IHD_PROJECT){ sc.onerror(); return; }
      PID = window.IHD_PROJECT.id; loadProject(window.IHD_PROJECT); state.name = window.IHD_NAME || "";
      const s = store.get("seq"); cur = (s !== null && !isNaN(+s) && +s >= -2 && +s < SEQS.length) ? +s : 0;
      setChrome(true); $("#home").hidden = true; $("#transfer").hidden = true; renderFilters(); renderAll(); probeLocal();
    };
    sc.onerror = () => { setChrome(false); $("#view").innerHTML = '<div class="seqhead"><h2>In-House-Dubbing</h2><p class="summary">Le fichier <code>_projet.js</code> est introuvable à côté de cette page. Il est déposé par le bouton « Transfert audio » de la version en ligne.</p></div>'; };
    document.body.appendChild(sc);
  }
})();
